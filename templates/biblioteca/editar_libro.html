{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>✏️ Editar Libro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'biblioteca/css/agregar_libro.css' %}">
</head>
<body>


    <div class="mx-auto p-4 rounded-4 shadow-sm"
        style="
            max-width:650px;
            background:#f8f4ef;
            border:1px solid #e6ded4;
        ">
        
        <!-- Título -->
        <h2 class="text-center mb-4"
            style="color:#6a4e42; font-weight:700;">
            🪶📜 Editar libro
        </h2>

        <!-- Errores -->
        {% if form.errors or form.non_field_errors %}
            <div class="alert alert-danger rounded-3">
                {{ form.non_field_errors }}
                {% for field in form %}
                    {% for error in field.errors %}
                        <div>{{ field.label }}: {{ error }}</div>
                    {% endfor %}
                {% endfor %}
            </div>
        {% endif %}

        <!-- Formulario -->
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-fields">
                {{ form.as_p }}
            </div>

            <!-- Botones -->
            <div class="text-center mt-4 d-flex justify-content-center gap-3 flex-wrap">
                <button type="submit"
                        class="btn rounded-pill px-4 py-2"
                        style="border:2px solid #6a4e42; color:#6a4e42;">
                    Guardar cambios
                </button>

                <a href="{% url 'biblioteca' %}"
                   class="btn rounded-pill px-4 py-2"
                   style="border:2px solid #b8a79c; color:#7c6a5e;">
                    Cancelar
                </a>
            </div>
        </form>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
