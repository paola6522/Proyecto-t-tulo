{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar entrada</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS personalizado (fondos, tipografías, cozy style) -->
    <link rel="stylesheet" href="{% static 'biblioteca/css/estilos_formulario.css' %}">
</head>

<body class="bg-cream">

<div class="container py-5">
    <div class="form-container mx-auto shadow-sm p-5 rounded-4"
        style="max-width:600px; background:#fdf8f3; border:1px solid #e6dfd7;">

        <h4 class="text-center text-brown" style="font-weight:600;">
            ¿Quieres eliminar esta entrada del libro
            <em class="fw-bold">“{{ entrada.libro_leido.titulo }}”</em>?
        </h4>

        <p class="text-center text-muted mt-2">
            Esta acción no se puede deshacer 🥺
        </p>

        <form method="post" class="text-center mt-4">
            {% csrf_token %}

            <button type="submit"
                    class="btn btn-danger rounded-pill px-4 py-2 shadow-sm"
                    style="background:#b84242; border:none;">
                🗑 Eliminar
            </button>

            <a href="{% url 'diario_lector' %}"
               class="btn btn-outline-secondary rounded-pill px-4 py-2 shadow-sm ms-2">
                Cancelar
            </a>
        </form>

    </div>
</div>

</body>
</html>
