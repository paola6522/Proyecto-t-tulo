{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estadísticas lectoras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'biblioteca/css/diario.css' %}" rel="stylesheet">
</head>
<body class="bg-cream">

<!-- Botón de regreso -->
<div class="d-flex justify-content-end me-4 mt-3">
    <a href="{% url 'inicio' %}" class="btn btn-outline-primary rounded-pill">.☘︎ ݁˖ Volver al inicio</a>
</div>

<!-- Contenido principal -->
<div class="container mt-5">

    <!-- Título principal -->
    <div class="text-center mb-4">
        <h2 class="title-cozy">〽 Estadísticas de tu lectura</h2>
        <p class="title-cozy">Visualiza tu progreso y hábitos mes a mes.</p>
    </div>

    <!-- Gráfico de estado -->
    <div class="row justify-content-center mb-4">
        <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm p-4 rounded-4">
            <h5 class="text-center mb-4 title-cozy">🍂🕮 Libros por estado</h5>
            <div class="d-flex justify-content-center">
                <!-- contenedor con tamaño controlado -->
                <div style="max-width: 320px; width: 100%;">
                    <canvas id="graficoEstado"></canvas>
                </div>
            </div>
        </div>
        </div>
    </div>

    <!-- Gráfico de libros por mes -->
    <div class="row justify-content-center mb-4">
        <div class="col-md-10">
            <div class="card shadow-sm p-4 rounded-4">
                <h5 class="text-center mb-4 title-cozy">🕰️🗓 Evolución mensual por estado</h5>
                <div class="d-flex justify-content-center">
                    <div style="max-width: 900px; width: 100%;">
                        <canvas id="graficoMes"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Variables enviadas desde Django -->
<script>
    window.etiquetas = {{ etiquetas|safe }};
    window.cantidades = {{ cantidades|safe }};
    window.meses = {{ meses|safe }};
    window.datos_linea = {{ datos_linea|safe }};
</script>

<!-- Archivo con tu JS separado -->
<script src="{% static 'biblioteca/js/estadisticas.js' %}"></script>

</body>
</html>
