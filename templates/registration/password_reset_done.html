{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Correo enviado</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'biblioteca/css/estilos_formulario.css' %}">
</head>

<body class="bg-light">

<div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="form-container shadow p-5 rounded-4 bg-white text-center" 
         style="max-width: 600px; width: 100%;">

        <!-- Encabezado -->
        <h2 class="fw-bold mb-3">📩 ¡Correo enviado!</h2>

        <p class="text-muted mb-4" style="font-size: 1.1rem;">
            Si el correo ingresado está asociado a una cuenta, te enviaremos un mensaje con
            las instrucciones para restablecer tu contraseña.
        </p>

        <!-- Botón volver -->
        <a href="{% url 'login' %}" 
           class="btn btn-custom rounded-pill px-4 py-2 mt-2">
            🌸 Volver al inicio de sesión
        </a>

    </div>
</div>

</body>
</html>
