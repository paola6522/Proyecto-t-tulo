{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar libro</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos del proyecto -->
    <link rel="stylesheet" href="{% static 'biblioteca/css/estilos_formulario.css' %}">
</head>

<body class="bg-cream">

<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">

    <div class="text-center p-5 rounded-4 shadow-sm"
         style="max-width: 500px; width: 100%;
                background:#fdf8f3;
                border: 1px solid #e6dfd7;">

        <h4 class="mb-4" style="font-family: 'Georgia', serif; color:#6d4b3b;">
            ¿Quieres eliminar<br>
            <em class="fw-bold">“{{ libro.titulo }}”</em>?
        </h4>

        <p class="text-muted" style="font-size: 0.95rem;">
            Esta acción no se puede deshacer 🥺
        </p>

        <form method="post" class="mt-4">
            {% csrf_token %}

            <!-- Botón eliminar -->
            <button type="submit"
                    class="btn rounded-pill px-4 py-2 shadow-sm"
                    style="background:#b84242; color:white; border:none;">
                🗑 Eliminar
            </button>

            <!-- Botón cancelar -->
            <a href="{% url 'biblioteca' %}"
               class="btn btn-outline-secondary rounded-pill px-4 py-2 shadow-sm ms-2">
                Cancelar
            </a>
        </form>

    </div>
</div>

</body>
</html>
