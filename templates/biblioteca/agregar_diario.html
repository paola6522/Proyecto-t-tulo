{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>💐📝 Nueva entrada del diario</title>

    <!-- Bootstrap + íconos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- Usar el mismo CSS que Diario -->
    <link rel="stylesheet" href="{% static 'biblioteca/css/agregar_libro.css' %}">
</head>
<body class="bg-cream">

<div class="container py-5">

    <!-- Contenedor bonito estilo cozy -->
    <div class="mx-auto p-4 rounded-4 shadow-sm"
        style="
            max-width:650px;
            background:#f8f4ef;
            border:1px solid #e6ded4;
        ">

        <!-- Título -->
        <h2 class="text-center mb-4" style="color:#6a4e42; font-weight:700;">
            🪶📜 Nueva entrada del diario
        </h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- LIBRO LEÍDO -->
            <div class="mb-3">
                <label class="form-label fw-semibold" style="color:#6a4e42;">
                    {{ form.libro_leido.label }}
                </label>
                {{ form.libro_leido }}
            </div>

            <!-- FRASE ICÓNICA -->
            <div class="mb-3">
                <label class="form-label fw-semibold" style="color:#6a4e42;">
                    {{ form.frase_iconica.label }}
                </label>
                {{ form.frase_iconica }}
            </div>

            <!-- PUNTO CLAVE -->
            <div class="mb-3">
                <label class="form-label fw-semibold" style="color:#6a4e42;">
                    {{ form.punto_clave.label }}
                </label>
                {{ form.punto_clave }}
            </div>

            <!-- NOTA PERSONAL -->
            <div class="mb-3">
                <label class="form-label fw-semibold" style="color:#6a4e42;">
                    {{ form.nota_personal.label }}
                </label>
                {{ form.nota_personal }}
            </div>

            <!-- ⭐ PUNTUACIÓN CON ESTRELLAS -->
            <div class="mb-3">
                <label class="form-label fw-semibold" style="color:#6a4e42;">
                    Puntuación
                </label>

                <div id="rating-stars"
                    class="d-flex gap-2 justify-content-center fs-3 py-2">
                    {% for i in "12345" %}
                        <i class="bi bi-star-fill text-muted star"
                           data-value="{{ forloop.counter }}"
                           style="cursor:pointer;"></i>
                    {% endfor %}
                </div>

                <!-- Campo oculto donde se guarda la puntuación -->
                {{ form.puntuacion }}
            </div>

            <!-- Botones -->
            <div class="text-center mt-4 d-flex justify-content-center gap-3">
                <button type="submit"
                    class="btn rounded-pill px-4 py-2"
                    style="border:2px solid #6a4e42; color:#6a4e42;">
                    Guardar entrada
                </button>

                <a href="{% url 'diario_lector' %}"
                   class="btn rounded-pill px-4 py-2"
                   style="border:2px solid #b8a79c; color:#7c6a5e;">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>


<script>
    const stars = document.querySelectorAll('.star');
    const puntuacionInput = document.getElementById('id_puntuacion');

    stars.forEach((star, index) => {
        star.addEventListener('click', () => {
            puntuacionInput.value = index + 1;
            stars.forEach((s, i) => {
                s.classList.toggle('text-warning', i <= index);
                s.classList.toggle('text-muted', i > index);
            });
        });
    });
</script>

</body>
</html>
