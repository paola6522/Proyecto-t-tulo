{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Entrada del Diario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'biblioteca/css/agregar_libro.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .star {
            cursor: pointer;
            font-size: 2rem;
        }
        .star.selected {
            color: gold;
        }
    </style>
</head>
<body class="bg-cream">

<div class="container py-5">
    <div class="form-container mx-auto shadow-sm p-4 rounded-4"
         style="
            max-width: 700px;
            background: #f8f4ef;
            border: 1px solid #e4d8cf;
         ">
        
        <h2 class="text-center mb-4" style="color:#6a4e42; font-weight:700;">
            🪶📜 Editar Entrada del Diario
        </h2>
        
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Libro seleccionado -->
            <div class="mb-3">
                <label class="form-label fw-semibold" style="color:#6a4e42;">
                    {{ form.libro_leido.label }}
                </label>
                {{ form.libro_leido }}
            </div>

            <!-- Frase icónica -->
            <div class="mb-3">
                <label class="form-label fw-semibold" style="color:#6a4e42;">
                    {{ form.frase_iconica.label }}
                </label>
                {{ form.frase_iconica }}
            </div>

            <!-- Punto clave -->
            <div class="mb-3">
                <label class="form-label fw-semibold" style="color:#6a4e42;">
                    {{ form.punto_clave.label }}
                </label>
                {{ form.punto_clave }}
            </div>

            <!-- Nota personal -->
            <div class="mb-3">
                <label class="form-label fw-semibold" style="color:#6a4e42;">
                    {{ form.nota_personal.label }}
                </label>
                {{ form.nota_personal }}
            </div>

            <!-- ⭐ Puntuación estilo cozy -->
            <div class="mb-3 text-center">
                <label class="form-label fw-semibold" style="color:#6a4e42;">
                    Puntuación
                </label>

                {% with puntuacion=form.puntuacion.value|add:"0" %}
                    <div id="rating-stars" class="d-flex gap-2 justify-content-center mb-2 fs-3">
                        {% for i in "12345" %}
                            <i class="bi bi-star-fill star 
                                {% if forloop.counter <= puntuacion %}
                                    selected
                                {% endif %}"
                                data-value="{{ forloop.counter }}">
                            </i>
                        {% endfor %}
                    </div>
                {% endwith %}

                <input type="hidden" name="puntuacion" id="id_puntuacion"
                    value="{{ form.puntuacion.value|default:0 }}">
            </div>


            <!-- Botones -->
            <div class="text-center mt-4 d-flex justify-content-center gap-3">
                <button type="submit"
                        class="btn rounded-pill px-4 py-2"
                        style="border:2px solid #6a4e42; color:#6a4e42;">
                    Guardar cambios
                </button>

                <a href="{% url 'diario_lector' %}"
                   class="btn rounded-pill px-4 py-2"
                   style="border:2px solid #b8a79c; color:#7c6a5e;">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>


<script>
    document.addEventListener("DOMContentLoaded", function () {
        const stars = document.querySelectorAll('.star');
        const puntuacionInput = document.getElementById('id_puntuacion');

        stars.forEach((star, index) => {
            star.addEventListener('click', () => {
                const value = index + 1;
                puntuacionInput.value = value;

                stars.forEach((s, i) => {
                    s.classList.toggle('selected', i < value);
                });
            });
        });
    });
</script>

</body>
</html>
